name: release

# Builds `metax` on native runners for the three supported platforms and
# publishes the binaries as a GitHub release and as conda packages on a
# personal anaconda.org channel. Nothing is compiled inside the conda recipe:
# it only wraps binaries that were already built and smoke-tested here.
#
# The workflow only runs when started by hand (Actions > release > Run
# workflow, or `gh workflow run release.yml --ref <branch>`), so not every
# version gets published. It releases the version in Cargo.toml from the
# commit it runs on as tag v<version>, which is created if it does not exist
# yet. The release text is taken from dist/release-notes/v<version>.md when
# that file exists. Untick both inputs for a test build.
#
# Publishing to anaconda.org requires the ANACONDA_API_TOKEN secret and the
# CONDA_CHANNEL variable.
on:
  workflow_dispatch:
    inputs:
      github_release:
        description: "Create the GitHub release with the binaries"
        type: boolean
        default: true
      conda:
        description: "Upload the conda packages to anaconda.org"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Stops a run that could not publish before three builds are spent on it.
  check:
    name: check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version, tag and channel
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.github_release }}
          CONDA: ${{ inputs.conda }}
          HAS_TOKEN: ${{ secrets.ANACONDA_API_TOKEN != '' }}
          CHANNEL: ${{ vars.CONDA_CHANNEL }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          recipe=$(sed -n 's/^  version: "\(.*\)"$/\1/p' dist/conda/recipe.yaml)
          [ "$recipe" = "$version" ] \
            || fail "Cargo.toml has version $version but dist/conda/recipe.yaml has '$recipe'"
          tag="v$version"

          if [ "$RELEASE" = "true" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              fail "release $tag already exists"
            fi
            # The last line is the commit an annotated tag points to.
            tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)
            [ -z "$tagged" ] || [ "$tagged" = "$GITHUB_SHA" ] \
              || fail "tag $tag points to $tagged, but this run builds $GITHUB_SHA"
          fi

          if [ "$CONDA" = "true" ]; then
            [ "$HAS_TOKEN" = "true" ] || fail "the ANACONDA_API_TOKEN secret is not set"
            [ -n "$CHANNEL" ] || fail "the CONDA_CHANNEL variable is not set"
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://api.anaconda.org/release/$CHANNEL/metax/$version")
            [ "$status" = 404 ] \
              || fail "metax $version is already on anaconda.org/$CHANNEL (HTTP $status)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building metax $version from $GITHUB_SHA"

  build:
    name: ${{ matrix.conda_platform }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - conda_platform: linux-64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - conda_platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          # Native Apple Silicon. This is the only runner that can execute the
          # arm64 binary, which is why it is worth the cost on a private repo
          # (macOS minutes bill at 10x). Cross-compiling with cargo-zigbuild on
          # Linux also works, but ships a binary that was never run.
          - conda_platform: osx-arm64
            target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --bin metax --target ${{ matrix.target }}

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          dir=dist/conda/staging/${{ matrix.conda_platform }}
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/metax "$dir/metax"
          strip "$dir/metax" || true
          chmod 755 "$dir/metax"

      # Runs the stripped binary, which is the one that ships.
      - name: Smoke test
        run: dist/conda/staging/${{ matrix.conda_platform }}/metax --version

      - uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.conda_platform }}
          path: dist/conda/staging/${{ matrix.conda_platform }}
          retention-days: 7

  package:
    name: conda packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/conda/staging
          pattern: staging-*

      - name: Flatten artifact directories
        run: |
          set -euo pipefail
          cd dist/conda/staging
          for d in staging-*; do mv "$d" "${d#staging-}"; done
          ls -R

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: rattler-build anaconda-client zstandard python=3.12
          init-shell: bash

      - name: Add licence texts to the recipe directory
        run: cp LICENSE THIRD_PARTY_NOTICES.md dist/conda/

      # Cross-packaging all three platforms from Linux is safe because the
      # recipe only copies files; build-conda.sh verifies afterwards that each
      # package holds the exact bytes that were built and tested upstream.
      - name: Build conda packages
        shell: bash -el {0}
        run: dist/conda/build-conda.sh

      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: dist/conda/output/**/*.conda

      - name: Publish
        if: inputs.conda
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          CHANNEL: ${{ vars.CONDA_CHANNEL }}
        run: |
          set -euo pipefail
          : "${ANACONDA_API_TOKEN:?missing ANACONDA_API_TOKEN secret}"
          : "${CHANNEL:?missing CONDA_CHANNEL variable}"
          find dist/conda/output -name '*.conda' \
            -exec anaconda upload --user "$CHANNEL" --label main {} +

  release:
    name: GitHub release
    needs: [check, build]
    if: inputs.github_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: staging-*

      # One archive per platform, named after the Rust target:
      # metax-v<version>-<target>/ holds the executable and both licence texts.
      # Fixed owner, order and time stamps make the archive depend on its
      # contents only.
      - name: Pack binaries
        shell: bash
        run: |
          set -euo pipefail
          mtime=$(git log -1 --format=%ct)
          mkdir -p pack assets
          for pair in linux-64:x86_64-unknown-linux-gnu \
                      linux-aarch64:aarch64-unknown-linux-gnu \
                      osx-arm64:aarch64-apple-darwin; do
            platform=${pair%%:*}
            name=metax-v$VERSION-${pair#*:}
            mkdir -p "pack/$name"
            cp "staging/staging-$platform/metax" LICENSE THIRD_PARTY_NOTICES.md "pack/$name/"
            chmod 755 "pack/$name/metax"
            chmod 644 "pack/$name/LICENSE" "pack/$name/THIRD_PARTY_NOTICES.md"
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
                -C pack -cf - "$name" | gzip -9 -n > "assets/$name.tar.gz"
          done
          (cd assets && sha256sum metax-v*.tar.gz > "metax-v$VERSION-sha256sums.txt")
          ls -l assets

      # GitHub adds the source archives of the tag to every release.
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=dist/release-notes/v$VERSION.md
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Metax $VERSION" "${notes_args[@]}"
