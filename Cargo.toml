[package]
name = "metax"
version = "2.0.2"
edition = "2021"
rust-version = "1.89"
description = "Coverage-aware taxonomic profiler for metagenomic sequencing data"
authors = ["Z.-L. Deng"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/hzi-bifo/Metax"
readme = "README.md"
keywords = ["metagenomics", "taxonomy", "profiling", "bioinformatics"]
categories = ["science"]

[workspace]
members = [".", "crates/metam"]
default-members = ["."]
resolver = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3

[dependencies]
clap = { version = "4.5", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
anyhow = "1.0"
rayon = "1.7"
indexmap = "2.2"
log = "0.4"
env_logger = "0.11"
statrs = "0.16"
csv = "1.3"
# Only UTC timestamps are used; "now" avoids the local-timezone lookup that
# "clock" pulls in, and with it a platform-specific dependency chain.
chrono = { version = "0.4", default-features = false, features = ["now"] }
crossbeam-channel = "0.5"
dirs = "6.0"
indicatif = { version = "0.17", features = ["rayon"] }
rust-htslib = { version = "0.43", default-features = false, features = ["bzip2", "lzma"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
tempfile = "3.20"
tar = { version = "0.4", default-features = false }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
xz2 = { version = "0.1", default-features = false }
rand = "0.8"
zstd = "0.13"
metam = { path = "crates/metam" }
