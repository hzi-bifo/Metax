[package]
name = "metam"
version = "0.3.6"
edition = "2021"
description = "Read mapper library compiled into Metax"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.20"
